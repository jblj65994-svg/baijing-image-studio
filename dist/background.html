<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>换背景｜白境工作台</title>
  <style>
    :root{--ink:#14231c;--muted:#718078;--line:#e2e9e3;--green:#1f6f4c;--soft:#f5f8f4;--cream:#fcfcf8;--err:#b9483f}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}
    .topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:34px;background:#fff}.brand{font-weight:700}.brand b{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--green);color:#fff;margin-right:7px}.nav{display:flex;gap:28px}.nav a{font-size:13px;color:var(--muted);text-decoration:none}.nav a.active{color:var(--green);font-weight:700;border-bottom:2px solid var(--green);padding:26px 0 22px}
    .hero{text-align:center;padding:52px 18px 34px;background:radial-gradient(circle at center top,#eef9ed 0,rgba(238,249,237,0) 45%)}.eyebrow{font-size:12px;color:var(--green);font-weight:700;margin:0 0 12px;letter-spacing:1px}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,5vw,56px);font-weight:500;margin:0}.hero p:last-child{color:var(--muted);margin:14px 0 0}
    .workspace{max-width:1220px;margin:0 auto;padding:0 24px 70px}.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:24px}.panel{background:#fff;border:1px solid var(--line);padding:28px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.number{font-size:11px;color:#70a37c;font-weight:700;margin:0 0 7px}.panel h2{font-size:21px;margin:0}.hint{font-size:12px;color:#8b9890;margin:4px 0 0}
    .stage-wrap{margin-top:24px;padding:18px;border:1px dashed #bbccc0;background:#f0f4ef;display:grid;place-items:center}.stage-wrap canvas{width:min(100%,640px);height:auto;background:#fff;display:block;touch-action:none;box-shadow:0 12px 34px rgba(38,61,46,.10)}.empty{min-height:520px;width:100%;display:grid;place-items:center;text-align:center;color:#92a099;background:#fff}.empty span{font-size:32px;color:#96ba9c}.empty p{font-size:12px}
    .drop{height:142px;width:100%;margin-top:20px;border:1px dashed #bbccc0;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.drop:hover{border-color:var(--green)}.drop.has-image{padding:10px}.drop img{width:100%;height:100%;object-fit:contain}.upload-icon{display:grid;place-items:center;width:38px;height:38px;border:1px solid #bad1bf;color:var(--green);font-size:20px;margin-bottom:9px}.drop strong{font-size:14px}.drop small{font-size:12px;color:#849087;margin-top:6px}.replace{border:0;background:none;color:var(--green);text-decoration:underline;padding:10px 0 0}
    .section{margin-top:24px;padding-top:22px;border-top:1px solid #ecf0ec}.field{display:block;font-size:13px;font-weight:700;margin-bottom:11px}.segmented{display:flex;gap:8px}.segmented button{flex:1;background:#fff;border:1px solid #dce4dd;padding:10px 6px;color:#607067;font-size:12px}.segmented button.selected{background:#eff8ee;border-color:#80ad89;color:var(--green);font-weight:700}.note{margin-top:16px;padding:12px 14px;background:#f3f7f1;color:#627168;font-size:12px;line-height:1.65}.note b{color:var(--green)}
    .swatches{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d9e2da}.swatch.selected{box-shadow:0 0 0 2px var(--green)}.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.template{height:72px;border:1px solid #dce4dd;padding:0;background-size:cover;background-position:center;position:relative;overflow:hidden}.template.selected{border:2px solid var(--green)}.template span{position:absolute;left:6px;bottom:6px;background:rgba(18,28,23,.62);color:#fff;font-size:11px;padding:2px 5px;border-radius:3px}.upload-bg{display:block;border:1px dashed #bbccc0;background:#f7f9f5;padding:10px;color:var(--green);font-size:12px}
    .adjust{display:grid;grid-template-columns:1fr 1fr;gap:18px}.range label{display:flex;justify-content:space-between;font-size:12px;color:#66756c;margin-bottom:8px}.range input{width:100%;accent-color:var(--green)}.toggle-row{display:flex;justify-content:space-between;align-items:center}.toggle{width:44px;height:24px;border:0;border-radius:99px;background:#c8d4ca;padding:3px}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--green)}.toggle.on i{transform:translateX(20px)}
    .primary{width:100%;margin-top:24px;background:var(--green);color:#fff;border:0;padding:14px 16px;font-size:14px;font-weight:700;display:flex;justify-content:space-between}.primary:disabled{background:#91aa9b;cursor:not-allowed}.download{display:block;width:190px;margin:20px 0 0 auto;background:var(--green);color:#fff;text-decoration:none;text-align:center;padding:12px 15px;font-weight:700}.download.disabled{background:#d8dfd9;color:#94a097;cursor:not-allowed}
    .status{margin:18px 0 0;font-size:12px;color:#73837a}.status b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#78ad80;margin-right:7px}.status.error{color:var(--err)}.status.error b{background:var(--err)}.progress{display:none;margin-top:16px;padding:13px 15px;background:#f5f8f3;color:#68776d;font-size:12px}.progress.show{display:block}.progress.error{background:#fff2f1;color:var(--err)}.progress-row{display:flex;justify-content:space-between;margin-bottom:8px}.bar{height:7px;border-radius:999px;background:#dfe8df;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green);transition:.2s}.progress.error .bar i{background:var(--err)}
    .version{position:fixed;right:12px;bottom:12px;padding:6px 9px;background:#12382b;color:#fff;font:12px/1.2 Arial,sans-serif;z-index:9999;opacity:.85}
    @media(max-width:860px){.layout{grid-template-columns:1fr}.nav{display:none}.empty{min-height:320px}.template-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.panel{padding:20px}.adjust{grid-template-columns:1fr}.download{width:100%}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><b>白</b>白境工作台</div><nav class="nav"><a href="./index.html">白底主图</a><a href="./enhance.html">图片增强</a><a class="active" href="./background.html">换背景</a><a href="./index.html#templates">营销模板</a></nav></header>
  <section class="hero"><p class="eyebrow">电商图片处理 · 第三站</p><h1>换一个场景，让商品更有氛围。</h1><p>专业抠图成功后才会合成；失败就明确提示，不再显示假结果。</p></section>
  <main class="workspace">
    <div class="layout">
      <section class="panel">
        <div class="panel-head"><div><p class="number">01</p><h2>预览合成效果</h2></div><p class="hint">支持拖动商品调整位置</p></div>
        <div class="stage-wrap"><div class="empty" id="empty"><div><span>✦</span><p>上传商品图片后开始换背景</p></div></div><canvas id="canvas" hidden></canvas></div>
        <p class="status" id="statusLine"><b></b><span id="status">等待上传商品图片</span></p>
        <div class="progress" id="progress"><div class="progress-row"><strong id="progressText">准备中</strong><span id="progressPercent">0%</span></div><div class="bar"><i id="progressBar"></i></div></div>
        <a class="download disabled" id="download" href="#" aria-disabled="true">下载合成图片 ↓</a>
      </section>
      <section class="panel">
        <div class="panel-head"><div><p class="number">02</p><h2>设置换背景</h2></div><p class="hint">可以随时重新调整</p></div>
        <button class="drop" id="drop" type="button"><span class="upload-icon">↑</span><strong>点击或拖入商品图片</strong><small>建议使用主体清晰、背景简单的图片</small></button><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden><button class="replace" id="replace" type="button" hidden>重新选择图片</button>
        <div class="section"><label class="field">主体处理</label><div class="segmented" id="subjectMode"><button class="selected" data-value="professional" type="button">专业抠图</button><button data-value="original" type="button">保留原图</button></div><div class="note"><b>专业抠图</b><br>默认调用 remove.bg。接口失败、没有透明主体、主体太小，都会停止合成并显示原因。</div></div>
        <div class="section"><label class="field">背景颜色</label><div class="swatches" id="swatches"><button class="swatch selected" data-color="#ffffff" style="background:#fff" aria-label="白色"></button><button class="swatch" data-color="#f1eee7" style="background:#f1eee7" aria-label="米色"></button><button class="swatch" data-color="#e5ece6" style="background:#e5ece6" aria-label="浅绿"></button><button class="swatch" data-color="#e6eef4" style="background:#e6eef4" aria-label="浅蓝"></button><button class="swatch" data-color="#1f6a4a" style="background:#1f6a4a" aria-label="品牌绿"></button><button class="swatch" data-color="#1a1f1c" style="background:#1a1f1c" aria-label="深色"></button></div></div>
        <div class="section"><label class="field">场景模板</label><div class="template-grid" id="templates"></div><label class="upload-bg"><input id="bgFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>上传自定义背景图</label></div>
        <div class="section"><div class="adjust"><div class="range"><label>商品大小 <span id="scaleValue">90%</span></label><input id="scale" type="range" min="45" max="135" value="90"></div><div class="range"><label>旋转角度 <span id="rotateValue">0°</span></label><input id="rotate" type="range" min="-15" max="15" value="0"></div></div><div class="toggle-row" style="margin-top:20px"><div><strong style="font-size:13px">自然投影</strong><div class="hint">为商品添加轻柔阴影</div></div><button class="toggle on" id="shadow" type="button"><i></i></button></div></div>
        <button class="primary" id="generate" type="button" disabled>开始合成 <span>→</span></button>
      </section>
    </div>
  </main>
  <div class="version">版本 20260805g</div>
  <script src="./background.js?v=20260805g"></script>
</body>
</html>
