<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>换背景｜白境工作台</title>
  <style>
    :root{--ink:#15221c;--muted:#718078;--line:#e3e9e4;--green:#1f6a4a;--soft:#f7f8f4;--cream:#fcfcf9;--err:#b94d42}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:Arial,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1200px)/2));gap:48px;background:var(--cream)}.brand{font-size:18px;font-weight:700;white-space:nowrap}.brand b{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;margin-right:8px;color:#fff;background:var(--green);font-size:14px}.nav{display:flex;gap:30px;flex:1}.nav a{color:var(--muted);font-size:14px;text-decoration:none}.nav .active{color:var(--green);font-weight:700;border-bottom:2px solid var(--green);padding:27px 0 24px}.login{border:0;background:none;color:#46554d;font-size:14px}.hero{text-align:center;padding:58px 24px 38px;background:radial-gradient(circle at 50% 30%,#edf8eb 0,rgba(237,248,235,0) 43%)}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:1.6px;margin:0 0 13px}.hero h1{font-family:Georgia,"Songti SC",serif;font-weight:500;letter-spacing:-1.5px;font-size:clamp(34px,5vw,54px);margin:0}.hero p:last-child{margin:16px 0 0;color:var(--muted)}.workspace{max-width:1200px;margin:0 auto;padding:0 24px 72px}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:24px}.panel{border:1px solid var(--line);background:#fff;padding:28px}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.number{color:#70a37c;letter-spacing:1px;font-size:11px;font-weight:700;margin:0 0 5px}.panel h2{font-size:20px;margin:0}.hint{color:#8b9790;font-size:12px;margin:4px 0 0}.stage-wrap{margin-top:22px;padding:18px;background:#f0f3ef;border:1px dashed #bbccc0;display:grid;place-items:center}.stage-wrap canvas{width:min(100%,600px);height:auto;display:block;box-shadow:0 12px 34px rgba(38,61,46,.1);background:#fff}.empty{min-height:420px;width:100%;display:grid;place-items:center;text-align:center;color:#9aa69f;font-size:12px;background:#fff}.empty span{color:#9bbda0;font-size:32px}.drop{height:142px;margin-top:20px;background:var(--soft);border:1px dashed #bbccc0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;color:var(--ink);width:100%;transition:.2s}.drop:hover{border-color:var(--green);background:#f5fbf4}.drop.has-image{padding:10px;background:#f4f7f2}.drop img{width:100%;height:100%;object-fit:contain}.upload-icon{display:grid;place-items:center;border:1px solid #bad1bf;height:38px;width:38px;color:var(--green);font-size:20px;margin-bottom:9px}.drop strong{font-size:14px}.drop small{color:#849087;font-size:12px;margin-top:6px}.replace{border:0;background:none;color:var(--green);font-size:13px;text-decoration:underline;padding:10px 0 0}.section{margin-top:24px;padding-top:22px;border-top:1px solid #ecf0ec}.field{display:block;font-size:13px;font-weight:700;margin-bottom:11px}.segmented{display:flex;gap:8px}.segmented button{flex:1;background:#fff;border:1px solid #dce4dd;padding:10px 6px;color:#607067;font-size:12px}.segmented button.selected{background:#eff8ee;color:var(--green);border-color:#80ad89;font-weight:700}.swatches{display:flex;flex-wrap:wrap;gap:9px}.swatch{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d9e2da;cursor:pointer}.swatch.selected{box-shadow:0 0 0 2px var(--green)}.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.template{height:72px;border:1px solid #dce4dd;padding:0;overflow:hidden;position:relative;background-size:cover;background-position:center}.template.selected{border:2px solid var(--green)}.template span{position:absolute;bottom:5px;left:6px;color:#fff;background:rgba(19,30,24,.56);font-size:11px;padding:2px 5px;border-radius:3px}.upload-bg{border:1px dashed #bbccc0;background:#f7f9f5;padding:10px;width:100%;color:var(--green);font-size:12px}.adjust{display:grid;grid-template-columns:1fr 1fr;gap:16px}.range label{display:flex;justify-content:space-between;font-size:12px;color:#66756c;margin-bottom:8px}.range input{width:100%;accent-color:var(--green)}.toggle-row{display:flex;justify-content:space-between;align-items:center}.toggle{width:44px;height:24px;border:0;border-radius:99px;background:#c8d4ca;padding:3px}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}.toggle.on{background:var(--green)}.toggle.on i{transform:translateX(20px)}.primary{width:100%;margin-top:24px;color:#fff;background:var(--green);border:0;padding:14px 16px;font-size:14px;font-weight:700;display:flex;justify-content:space-between}.primary:disabled{background:#8aa596;cursor:not-allowed}.status{margin:18px 0 0;color:#809087;font-size:12px}.status b{height:7px;width:7px;display:inline-block;background:#7bac82;border-radius:50%;margin-right:7px}.status.error{color:var(--err)}.status.error b{background:var(--err)}.progress{display:none;margin-top:16px;padding:13px 15px;background:#f5f8f3;color:#68776d;font-size:12px}.progress.show{display:block}.progress.error{background:#fff4f2;color:var(--err)}.progress-row{display:flex;justify-content:space-between;margin-bottom:8px}.bar{height:7px;background:#dfe8df;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}.progress.error .bar i{background:var(--err)}.download{display:block;width:190px;margin:20px 0 0 auto;color:#fff;background:var(--green);padding:12px 15px;font-size:14px;font-weight:700;text-decoration:none;text-align:center}.download.disabled{background:#d8dfd9;color:#94a097;cursor:not-allowed}.note{margin-top:18px;padding:12px 14px;background:#f3f7f1;color:#6c7a70;font-size:12px;line-height:1.65}.note b{color:var(--green)}.version{position:fixed;right:14px;bottom:10px;background:#1f6a4a;color:#fff;font-size:11px;padding:6px 9px}@media(max-width:850px){.layout{grid-template-columns:1fr}.empty{min-height:280px}.topbar{padding:0 18px;gap:0}.nav{display:none}.login{margin-left:auto}}@media(max-width:520px){.panel{padding:20px}.template-grid{grid-template-columns:repeat(2,1fr)}.adjust{grid-template-columns:1fr}.download{width:100%}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><b>白</b>白境工作台</div><div class="nav"><a href="./index.html">白底主图</a><a href="./enhance.html">图片增强</a><a class="active" href="./background.html">换背景</a><a href="./index.html#templates">营销模板</a></div><button class="login">登录 / 注册</button></header>
  <section class="hero"><p class="eyebrow">电商图片处理 · 第三站</p><h1>换一个场景，让商品更有氛围。</h1><p>专业抠图成功后才会合成；失败会明确报错，不再显示假结果。</p></section>
  <main class="workspace">
    <div class="layout">
      <section class="panel"><div class="panel-head"><div><p class="number">01</p><h2>预览合成效果</h2></div><p class="hint">主体会自动放在画面下半部</p></div><div class="stage-wrap"><div class="empty" id="empty"><div><span>✦</span><p>上传商品图片后开始换背景</p></div></div><canvas id="canvas" hidden aria-label="换背景预览"></canvas></div><p class="status" id="statusLine"><b></b><span id="status">等待上传商品图片</span></p><div class="progress" id="progress"><div class="progress-row"><strong id="progressText">正在准备</strong><span id="progressPercent">0%</span></div><div class="bar"><i id="progressBar"></i></div></div><a class="download disabled" id="download" href="#" aria-disabled="true">下载合成图片 ↓</a></section>
      <section class="panel"><div class="panel-head"><div><p class="number">02</p><h2>设置换背景</h2></div><p class="hint">可以随时重新调整</p></div><button class="drop" id="drop" type="button"><span class="upload-icon">↑</span><strong>点击或拖入商品图片</strong><small>建议使用主体清晰、边缘完整的首饰图</small></button><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden><button class="replace" id="replace" type="button" hidden>重新选择图片</button><div class="section"><label class="field">主体处理</label><div class="segmented" id="subjectMode"><button class="selected" data-value="professional" type="button">专业抠图</button><button data-value="original" type="button">保留原图</button></div><div class="note"><b id="modeTitle">remove.bg 专业服务</b><br><span id="modeNote">服务器端调用 remove.bg，拿到透明主体后才合成。</span></div></div><div class="section"><label class="field">背景颜色</label><div class="swatches" id="swatches"><button class="swatch selected" data-color="#ffffff" style="background:#fff" aria-label="白色"></button><button class="swatch" data-color="#f1eee7" style="background:#f1eee7" aria-label="米色"></button><button class="swatch" data-color="#e5ece6" style="background:#e5ece6" aria-label="浅绿"></button><button class="swatch" data-color="#e6eef4" style="background:#e6eef4" aria-label="浅蓝"></button><button class="swatch" data-color="#1f6a4a" style="background:#1f6a4a" aria-label="品牌绿"></button><button class="swatch" data-color="#1a1f1c" style="background:#1a1f1c" aria-label="深色"></button></div></div><div class="section"><label class="field">场景模板</label><div class="template-grid" id="templates"><button class="template selected" data-background="./assets/backgrounds/luxury-02-charcoal-marble.png" type="button" style="background-image:url('./assets/backgrounds/luxury-02-charcoal-marble.png')"><span>炭灰岩面</span></button><button class="template" data-background="./assets/backgrounds/luxury-07-ivory-travertine.png" type="button" style="background-image:url('./assets/backgrounds/luxury-07-ivory-travertine.png')"><span>暖灰洞石</span></button><button class="template" data-background="./assets/backgrounds/luxury-01-ivory-champagne.png" type="button" style="background-image:url('./assets/backgrounds/luxury-01-ivory-champagne.png')"><span>香槟石面</span></button><button class="template" data-background="./assets/backgrounds/luxury-05-emerald-velvet.png" type="button" style="background-image:url('./assets/backgrounds/luxury-05-emerald-velvet.png')"><span>墨绿丝绒</span></button><button class="template" data-background="./assets/backgrounds/luxury-10-pearl-satin.png" type="button" style="background-image:url('./assets/backgrounds/luxury-10-pearl-satin.png')"><span>象牙缎面</span></button><button class="template" data-background="./assets/backgrounds/luxury-06-midnight-glass.png" type="button" style="background-image:url('./assets/backgrounds/luxury-06-midnight-glass.png')"><span>烟熏黑石</span></button></div><label class="upload-bg"><input id="bgFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>上传自定义背景图</label></div><div class="section"><div class="adjust"><div class="range"><label>商品大小 <span id="scaleValue">90%</span></label><input id="scale" type="range" min="55" max="130" value="90"></div><div class="range"><label>旋转角度 <span id="rotateValue">0°</span></label><input id="rotate" type="range" min="-15" max="15" value="0"></div></div><div class="toggle-row" style="margin-top:20px"><div><strong style="font-size:13px">自然投影</strong><div class="hint">为商品添加轻柔阴影</div></div><button class="toggle on" id="shadow" type="button" aria-label="切换自然投影"><i></i></button></div></div><button class="primary" id="generate" type="button" disabled>上传图片后开始合成 <span>→</span></button></section>
    </div>
  </main>
  <div class="version">版本 20260805f</div>
  <script src="./background.js?v=20260805f"></script>
</body>
</html>
